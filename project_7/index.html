<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のアクションナビ:パーソナライズ未病対策</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <link href="[link removed]" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: {
              50: '#ECFDF5',
              100: '#D1FAE5',
              500: '#10B981',
              600: '#059669',
            },
            darkSlate: '#0F172A',
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.08), 0 8px 10px -6px rgba(16, 185, 129, 0.08);
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-darkSlate min-h-screen flex flex-col justify-between selection:bg-mint-100 selection:text-mint-600">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-mint-500 flex items-center justify-center text-white shadow-sm">
        <i class="fa-solid fa-compass text-sm"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-darkSlate">今日のアクションナビ</span>
    </div>
    <div class="flex items-center space-x-3">
      <button class="bg-gradient-to-r from-amber-400 to-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm flex items-center space-x-1 hover:opacity-95 transition">
        <i class="fa-solid fa-crown text-[10px]"></i>
        <span>プレミアム</span>
      </button>
      <button id="myPageBtn" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
        <i class="fa-regular fa-user text-sm"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-md w-full mx-auto px-5 py-6 space-y-6 pb-24">

    <!-- メインビジュアル / 健診結果OCR読み取りステータス -->
    <section class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-mint-50 rounded-full pointer-events-none"></div>
      <div class="flex items-start justify-between relative z-10">
        <div>
          <span class="inline-block bg-mint-50 text-mint-600 text-xs font-bold px-2.5 py-1 rounded-full mb-2">
            <i class="fa-solid fa-circle-check mr-1"></i>健診データ連携済み
          </span>
          <h2 class="text-base font-bold text-darkSlate">最新の健康状態を解析完了</h2>
          <p class="text-xs text-slate-500 mt-0.5">前回の数値より血糖値の改善傾向が見られます</p>
        </div>
      </div>
      <div class="mt-5 relative z-10">
        <button id="scanBtn" class="w-full bg-slate-50 hover:bg-mint-50 border border-dashed border-slate-200 hover:border-mint-500 text-slate-700 hover:text-mint-600 font-medium py-3 px-4 rounded-2xl text-sm flex items-center justify-center space-x-2 transition group">
          <i class="fa-solid fa-cloud-arrow-up text-mint-500 group-hover:scale-110 transition-transform"></i>
          <span>新しい健診結果を読み込ませる</span>
        </button>
      </div>
    </section>

    <!-- タスク提示エリア (センター・最重要) -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase">Today's Action</h3>
        <span class="text-xs text-mint-600 font-bold bg-mint-50 px-2 py-0.5 rounded">本日 1個限定</span>
      </div>

      <!-- アクションカード -->
      <div id="actionCard" class="bg-white rounded-3xl p-6 border border-slate-100 custom-shadow transition-all duration-300">
        <div class="flex items-center space-x-3 mb-4">
          <div class="w-12 h-12 rounded-2xl bg-mint-500 text-white flex items-center justify-center text-xl shadow-md shadow-mint-500/20">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div>
            <span class="text-xs text-mint-600 font-bold block">食事・栄養アドバイス</span>
            <h4 class="text-lg font-bold text-darkSlate leading-tight">夕食は炭水化物を控えめに</h4>
          </div>
        </div>

        <p class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-2xl mb-5 border border-slate-100/80">
          「今日の夕食は主食(ご飯や麺類)を普段の半分にし、最初に野菜スープやサラダからゆっくり食べましょう。」
        </p>

        <!-- ベネフィット可視化ゲージ -->
        <div class="mb-6 space-y-2">
          <div class="flex justify-between text-xs font-medium">
            <span class="text-slate-500">生活習慣改善へのインパクト</span>
            <span class="text-mint-600 font-bold">血糖値安定化 (期待度 高)</span>
          </div>
          <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
            <div class="bg-mint-500 h-full rounded-full w-4/5 transition-all duration-1000"></div>
          </div>
        </div>

        <!-- 完了チェックボタン -->
        <button id="completeBtn" class="w-full bg-mint-500 hover:bg-mint-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-mint-500/25 flex items-center justify-center space-x-2 transition active:scale-[0.98]">
          <i class="fa-solid fa-check text-base"></i>
          <span id="completeBtnText">今日のアクションを完了する</span>
        </button>
      </div>
    </section>

    <!-- サブセクション:専門家へのチャット相談バナー -->
    <section>
      <div class="bg-gradient-to-br from-slate-900 to-darkSlate text-white rounded-3xl p-6 relative overflow-hidden shadow-lg">
        <div class="absolute -right-8 -top-8 w-32 h-32 bg-mint-500/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="relative z-10 flex items-center justify-between">
          <div class="space-y-1 pr-4">
            <span class="bg-mint-500/20 text-mint-400 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">プレミアム機能</span>
            <h4 class="text-base font-bold">専門家へ直接チャット相談</h4>
            <p class="text-xs text-slate-300 leading-relaxed">管理栄養士や医師のパーソナライズされた個別食事指導を受けられます。</p>
          </div>
          <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-mint-400 shrink-span">
            <i class="fa-solid fa-comments text-xl"></i>
          </div>
        </div>
        <div class="mt-4 pt-4 border-t border-slate-800 flex items-center justify-between">
          <span class="text-xs text-slate-400">月額サブスクリプション</span>
          <button id="upgradeBtn" class="text-xs font-bold bg-mint-500 hover:bg-mint-600 text-white px-4 py-2 rounded-xl transition flex items-center space-x-1">
            <span>詳細を見る</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- フッターナビゲーション (下部固定) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-3 px-6 z-40 max-w-md mx-auto">
    <ul class="flex justify-around items-center">
      <li>
        <a href="#" class="flex flex-col items-center space-y-1 text-mint-500 transition">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="text-[10px] font-bold">ホーム</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
          <i class="fa-solid fa-chart-pie text-lg"></i>
          <span class="text-[10px] font-medium">食事・運動</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
          <i class="fa-solid fa-comments text-lg"></i>
          <span class="text-[10px] font-medium">専門家チャット</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
          <i class="fa-solid fa-gear text-lg"></i>
          <span class="text-[10px] font-medium">設定</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- インタラクション用JavaScript -->
  <script>
    // 完了ボタンのインタラクション
    const completeBtn = document.getElementById('completeBtn');
    const completeBtnText = document.getElementById('completeBtnText');
    const actionCard = document.getElementById('actionCard');
    let isCompleted = false;

    completeBtn.addEventListener('click', () => {
      isCompleted = !isCompleted;
      if (isCompleted) {
        completeBtn.classList.remove('bg-mint-500', 'hover:bg-mint-600', 'shadow-mint-500/25');
        completeBtn.classList.add('bg-slate-800', 'hover:bg-slate-900', 'shadow-slate-800/25');
        completeBtnText.textContent = '完了済み(明日もお楽しみに!)';
        actionCard.classList.add('border-mint-500', 'bg-mint-50/20');
      } else {
        completeBtn.classList.remove('bg-slate-800', 'hover:bg-slate-900', 'shadow-slate-800/25');
        completeBtn.classList.add('bg-mint-500', 'hover:bg-mint-600', 'shadow-mint-500/25');
        completeBtnText.textContent = '今日のアクションを完了する';
        actionCard.classList.remove('border-mint-500', 'bg-mint-50/20');
      }
    });

    // ダミーのファイルスキャンボタンイベント
    document.getElementById('scanBtn').addEventListener('click', () => {
      alert('健診結果ファイル(PDF/画像)の選択画面を開きます(シミュレーション)');
    });

    // マイページボタン
    document.getElementById('myPageBtn').addEventListener('click', () => {
      alert('マイページ・プロフィール画面へ遷移します');
    });

    // アップグレードボタン
    document.getElementById('upgradeBtn').addEventListener('click', () => {
      alert('プレミアムプラン入会画面へ遷移します');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマートパッキングキャンプ - 3D積載シミュレーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#1E3F20',
              light: '#2D5A31',
              dark: '#142B16',
            },
            sunset: {
              DEFAULT: '#FF6B35',
              light: '#FF8A5C',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4">
  <div class="w-full max-w-md h-screen sm:h-[844px] bg-slate-900 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border border-slate-800">
    <!-- ヘッダー -->
    <header class="flex items-center justify-between px-6 py-4 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-10">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-forest-light to-forest flex items-center justify-center shadow-md text-sunset">
          <i class="fa-solid fa-mountain text-sm"></i>
          <i class="fa-solid fa-boxes-stacked text-[10px] ml-0.5"></i>
        </div>
        <span class="font-bold text-lg tracking-tight text-white">SmartPacking</span>
      </div>
      <div class="flex items-center space-x-3">
        <button class="relative p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white transition">
          <i class="fa-regular fa-bell text-sm"></i>
          <span class="absolute top-1 right-1 w-2 h-2 bg-sunset rounded-full animate-pulse"></span>
        </button>
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 overflow-hidden flex items-center justify-center">
          <i class="fa-solid fa-user text-slate-400 text-sm"></i>
        </div>
      </div>
    </header>

    <!-- メインスクロールエリア -->
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-24">
      <!-- 上部エリア: 気象データ・環境・移動手段 -->
      <section class="p-6 pb-4">
        <div class="bg-gradient-to-r from-forest/50 to-slate-900 border border-forest-light/40 rounded-2xl p-4 shadow-lg">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2 text-xs text-emerald-400 font-medium bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800/50">
              <i class="fa-solid fa-cloud-sun text-sunset"></i>
              <span>晴れ 22°C / 富士山麓キャンプ場</span>
            </div>
            <span class="text-xs text-slate-400 font-medium">移動: SUV車載</span>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400">推奨積載率</p>
              <h2 class="text-xl font-bold tracking-tight text-white">最適バランス (82%)</h2>
            </div>
            <div class="px-3 py-1.5 bg-sunset/20 border border-sunset/40 text-sunset rounded-xl text-xs font-semibold flex items-center space-x-1">
              <i class="fa-solid fa-circle-check"></i>
              <span>準備万端</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 中央エリア: 3D積載シミュレーションプレビュー -->
      <section class="px-6 mb-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-300 flex items-center space-x-2">
            <i class="fa-solid fa-cube text-sunset"></i>
            <span>3D積載シミュレーション</span>
          </h3>
          <span class="text-xs text-emerald-400 font-medium">アルゴリズム稼働中</span>
        </div>
        <div class="relative w-full h-52 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center shadow-inner group">
          <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:2rem_2rem] opacity-30"></div>
          
          <div class="relative w-48 h-32 border-2 border-forest-light/60 rounded-xl bg-forest/20 backdrop-blur-sm flex flex-col items-center justify-center transform perspective-1000 rotate-x-12 rotate-y-12 shadow-2xl transition duration-500 group-hover:scale-105">
            <div class="absolute -top-3 px-2 py-0.5 bg-slate-800 border border-slate-700 text-[10px] text-slate-300 rounded font-mono">SUV Trunk 500L</div>
            <div class="grid grid-cols-3 gap-1.5 p-2 w-full h-full items-center justify-items-center">
              <div class="w-10 h-12 bg-sunset/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">テント</div>
              <div class="w-12 h-10 bg-emerald-600/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">クーラー</div>
              <div class="w-10 h-10 bg-amber-600/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">チェア</div>
              <div class="w-12 h-10 bg-blue-600/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">寝袋</div>
              <div class="w-10 h-10 bg-purple-600/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">ランタン</div>
              <div class="w-10 h-12 bg-indigo-600/90 rounded-md shadow flex items-center justify-center text-[10px] font-bold text-white">バーナー</div>
            </div>
          </div>
          
          <div class="absolute bottom-3 right-3">
            <button class="px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-xs text-white rounded-lg backdrop-blur shadow transition flex items-center space-x-1.5">
              <i class="fa-solid fa-rotate text-sunset"></i>
              <span>アングル変更</span>
            </button>
          </div>
        </div>
      </section>

      <!-- データ管理エリア: 総重量・容積・耐荷重アラート -->
      <section class="px-6 mb-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <p class="text-xs text-slate-400">総重量 / 上限</p>
              <p class="text-lg font-bold text-white">24.5 kg <span class="text-xs font-normal text-slate-400">/ 35.0 kg</span></p>
            </div>
            <div class="text-right">
              <p class="text-xs text-slate-400">総容積</p>
              <p class="text-lg font-bold text-white">310 L <span class="text-xs font-normal text-slate-400">/ 500 L</span></p>
            </div>
          </div>
          
          <div class="flex items-start space-x-3 p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-300 text-xs">
            <i class="fa-solid fa-triangle-exclamation text-sunset mt-0.5 text-sm"></i>
            <div>
              <span class="font-semibold text-white">自動警告アラート:</span> 耐荷重と重心バランスを最適化するため、重量のあるクーラーボックスは中央下部への配置を推奨します。
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 下部固定CTAボタン -->
    <div class="absolute bottom-16 left-0 right-0 px-6 bg-gradient-to-t from-slate-900 via-slate-900/90 to-transparent pt-4 pb-2 z-20">
      <button class="w-full py-4 bg-gradient-to-r from-sunset to-amber-500 hover:from-sunset-light hover:to-amber-400 text-white font-bold rounded-2xl shadow-lg shadow-sunset/25 transition duration-300 flex items-center justify-center space-x-2 text-sm">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>持ち物リスト・積載計画を自動生成する</span>
      </button>
    </div>

    <!-- ボトムタブバー -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex items-center justify-around px-2 z-30">
      <button class="flex flex-col items-center justify-center w-1/4 text-sunset space-y-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-medium">ホーム</span>
      </button>
      <button class="flex flex-col items-center justify-center w-1/4 text-slate-400 hover:text-slate-200 space-y-1 transition">
        <i class="fa-solid fa-cubes text-lg"></i>
        <span class="text-[10px] font-medium">3Dパッキング</span>
      </button>
      <button class="flex flex-col items-center justify-center w-1/4 text-slate-400 hover:text-slate-200 space-y-1 transition">
        <i class="fa-solid fa-suitcase text-lg"></i>
        <span class="text-[10px] font-medium">ギア管理</span>
      </button>
      <button class="flex flex-col items-center justify-center w-1/4 text-slate-400 hover:text-slate-200 space-y-1 transition">
        <i class="fa-solid fa-robot text-lg"></i>
        <span class="text-[10px] font-medium">AIアシスト</span>
      </button>
    </nav>
  </div>

  <script>
    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('nav button').forEach(b => {
          b.classList.remove('text-sunset');
          b.classList.add('text-slate-400');
        });
        this.classList.remove('text-slate-400');
        this.classList.add('text-sunset');
      });
    });
  </script>
</body>
</html>

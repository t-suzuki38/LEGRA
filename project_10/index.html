<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物カルテ - AIと育てるボタニカルライフ -</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              DEFAULT: '#8A9A86',
              light: '#F4F6F3',
              dark: '#6E7D6A'
            },
            leaf: {
              DEFAULT: '#4C9A2A',
              hover: '#3D7D21'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex justify-center items-center min-h-screen">
  <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden flex flex-col h-[850px] relative">
    <!-- Header -->
    <header class="px-6 py-4 flex justify-between items-center bg-white border-b border-slate-100 z-10">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-sage/20 flex items-center justify-center text-leaf font-bold">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-900">植物カルテ</span>
      </div>
      <button class="bg-gradient-to-r from-amber-400 to-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow-sm hover:opacity-90 transition flex items-center space-x-1">
        <i class="fa-solid fa-crown text-[10px]"></i>
        <span>PROプラン</span>
      </button>
    </header>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-y-auto pb-24 px-5 pt-4 space-y-6">
      <!-- Main Visual / Status Card -->
      <div class="bg-gradient-to-br from-sage/10 to-sage/30 rounded-2xl p-5 border border-sage/20 shadow-sm relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-leaf/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="flex justify-between items-start mb-3">
          <div>
            <span class="text-xs font-medium text-leaf bg-white/80 px-2.5 py-1 rounded-full shadow-xs">AI診断完了</span>
            <h2 class="text-xl font-bold text-slate-900 mt-2">モンステラ・デリシオーサ</h2>
            <p class="text-xs text-slate-600">リビング東窓際 / 室内</p>
          </div>
          <div class="w-14 h-14 rounded-full bg-white shadow-md flex flex-col items-center justify-center border-2 border-leaf/30">
            <span class="text-[10px] text-slate-400 font-bold">健康度</span>
            <span class="text-base font-extrabold text-leaf">98%</span>
          </div>
        </div>
        <div class="bg-white/70 backdrop-blur-xs rounded-xl p-3 flex items-center space-x-3 mt-4">
          <div class="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden flex-shrink-0">
            <img src="[link removed]" alt="モンステラ" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 text-xs">
            <p class="font-semibold text-slate-800">葉の色艶・ハリともに良好です!</p>
            <p class="text-slate-500 mt-0.5">次回の水やり目安: 3日後 (10/30)</p>
          </div>
        </div>
      </div>

      <!-- Sunlight & Environment Graph Section -->
      <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-800 flex items-center space-x-2">
            <i class="fa-solid fa-sun text-amber-500"></i>
            <span>日照環境の記録 (直近7日間)</span>
          </h3>
          <span class="text-xs text-slate-400 font-medium">最適値: 6h/日</span>
        </div>
        <div class="h-28 flex items-end justify-between px-2 pt-4 pb-2 bg-slate-50 rounded-xl">
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-sage/40 rounded-t-md h-12"></div>
            <span class="text-[10px] text-slate-400">月</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-sage/40 rounded-t-md h-16"></div>
            <span class="text-[10px] text-slate-400">火</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-leaf rounded-t-md h-20 shadow-xs"></div>
            <span class="text-[10px] text-slate-700 font-bold">水</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-sage/40 rounded-t-md h-14"></div>
            <span class="text-[10px] text-slate-400">木</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-sage/40 rounded-t-md h-18"></div>
            <span class="text-[10px] text-slate-400">金</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-leaf rounded-t-md h-22 shadow-xs"></div>
            <span class="text-[10px] text-slate-700 font-bold">土</span>
          </div>
          <div class="flex flex-col items-center space-y-1 flex-1">
            <div class="w-6 bg-leaf rounded-t-md h-20 shadow-xs"></div>
            <span class="text-[10px] text-slate-700 font-bold">日</span>
          </div>
        </div>
      </div>

      <!-- Today's Care Instructions -->
      <div class="space-y-3">
        <h3 class="text-sm font-bold text-slate-800 flex items-center space-x-2 px-1">
          <i class="fa-solid fa-list-check text-leaf"></i>
          <span>本日の水やり・ケア指示</span>
        </h3>
        <div class="space-y-2">
          <div class="bg-white rounded-xl p-3.5 border border-slate-100 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                <i class="fa-solid fa-droplet"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">葉水(霧吹き)の実施</h4>
                <p class="text-[11px] text-slate-500">乾燥しやすい葉の裏側を中心に</p>
              </div>
            </div>
            <button onclick="toggleCheck(this)" class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-transparent hover:border-leaf transition">
              <i class="fa-solid fa-check text-xs"></i>
            </button>
          </div>
          <div class="bg-white rounded-xl p-3.5 border border-slate-100 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-lg bg-green-50 text-leaf flex items-center justify-center">
                <i class="fa-solid fa-wind"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">換気とサーキュレーター稼働</h4>
                <p class="text-[11px] text-slate-500">空気を循環させて根腐れ防止</p>
              </div>
            </div>
            <button onclick="toggleCheck(this)" class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-transparent hover:border-leaf transition">
              <i class="fa-solid fa-check text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Floating Camera Button (Center Bottom) -->
    <div class="absolute bottom-16 left-0 right-0 flex justify-center z-20 pointer-events-none">
      <button onclick="openScanner()" class="pointer-events-auto bg-leaf hover:bg-leaf-hover text-white font-bold px-6 py-3.5 rounded-full shadow-lg shadow-leaf/30 flex items-center space-x-2 transform active:scale-95 transition">
        <i class="fa-solid fa-camera text-lg"></i>
        <span class="text-sm tracking-wide">植物をスキャン</span>
      </button>
    </div>

    <!-- Footer Navigation -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-100 flex justify-around items-center px-2 z-10 text-[10px] text-slate-400 font-medium">
      <button class="flex flex-col items-center space-y-1 text-leaf">
        <i class="fa-solid fa-house text-base"></i>
        <span>ホーム</span>
      </button>
      <button class="flex flex-col items-center space-y-1 hover:text-slate-600 transition">
        <i class="fa-solid fa-book-medical text-base"></i>
        <span>カルテ一覧</span>
      </button>
      <div class="w-10"></div>
      <button class="flex flex-col items-center space-y-1 hover:text-slate-600 transition">
        <i class="fa-solid fa-user-doctor text-base"></i>
        <span>相談(専門家)</span>
      </button>
      <button class="flex flex-col items-center space-y-1 hover:text-slate-600 transition">
        <i class="fa-solid fa-user text-base"></i>
        <span>マイページ</span>
      </button>
    </nav>
  </div>

  <!-- Scanner Modal -->
  <div id="scannerModal" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-3xl p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800 text-base flex items-center space-x-2">
          <i class="fa-solid fa-camera-retro text-leaf"></i>
          <span>AIカメラ診断</span>
        </h3>
        <button onclick="closeScanner()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="h-64 bg-slate-900 rounded-2xl relative overflow-hidden flex items-center justify-center">
        <div class="absolute inset-4 border-2 border-dashed border-white/50 rounded-xl flex items-center justify-center">
          <p class="text-white text-xs bg-black/50 px-3 py-1.5 rounded-full">植物を枠内に収めてください</p>
        </div>
      </div>
      <button onclick="simulateScan()" class="w-full bg-leaf text-white font-bold py-3 rounded-xl shadow-md hover:bg-leaf-hover transition">
        写真を撮影して診断する
      </button>
    </div>
  </div>

  <script>
    function toggleCheck(btn) {
      btn.classList.toggle('bg-leaf');
      btn.classList.toggle('border-leaf');
      btn.classList.toggle('text-white');
      btn.classList.toggle('border-slate-300');
    }

    function openScanner() {
      document.getElementById('scannerModal').classList.remove('hidden');
    }

    function closeScanner() {
      document.getElementById('scannerModal').classList.add('hidden');
    }

    function simulateScan() {
      alert('AIによる診断が完了しました!新しい植物カルテが追加されました。');
      closeScanner();
    }
  </script>
</body>
</html>

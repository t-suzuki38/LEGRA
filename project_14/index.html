<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マンスマ - 家族みんなで回せるデジタル回覧板＆カンタン管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <link rel="preconnect" href="[link removed]">
  <link rel="preconnect" href="[link removed]" crossorigin>
  <link href="[link removed]" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#1e3f20',
              dark: '#142b15',
              light: '#2e5e31'
            },
            coral: {
              DEFAULT: '#ff6f59',
              hover: '#ff573d'
            },
            offwhite: '#f8f9fa'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
      background-color: #f8f9fa;
      color: #333333;
    }
  </style>
</head>
<body class="bg-offwhite min-h-screen pb-24">
  <!-- ヘッダーエリア -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="bg-forest text-white w-10 h-10 rounded-2xl flex items-center justify-center text-lg shadow-md">
          <i class="fa-solid fa-house-chimney"></i>
        </div>
        <div>
          <h1 class="font-bold text-forest text-lg leading-tight">マンスマ</h1>
          <p class="text-xs text-gray-500 font-medium">パークハイツ中央管理組合</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button class="relative p-2.5 text-gray-600 hover:text-forest transition bg-gray-50 rounded-xl" aria-label="お知らせ">
          <i class="fa-solid fa-bell text-lg"></i>
          <span class="absolute top-1 right-1 bg-coral text-white text-xs w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
        </button>
        <button class="p-2.5 text-gray-600 hover:text-forest transition bg-gray-50 rounded-xl" aria-label="設定">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto px-4 py-6 space-y-6">
    <!-- ステータスカード（最上部） -->
    <section class="bg-forest text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
      <div class="absolute -right-4 -bottom-4 text-white/5 text-9xl pointer-events-none">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="relative z-10">
        <div class="flex items-center justify-between mb-4">
          <span class="bg-coral text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">本日のTODO</span>
          <span class="text-xs text-white/80 font-medium">リアルタイム更新</span>
        </div>
        <div class="space-y-3">
          <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 flex items-center justify-between border border-white/15 shadow-inner">
            <div class="flex items-center space-x-3.5">
              <div class="bg-coral text-white w-11 h-11 rounded-xl flex items-center justify-center text-lg shadow">
                <i class="fa-solid fa-book-open"></i>
              </div>
              <div>
                <p class="text-xs text-white/80 font-medium">デジタル回覧板</p>
                <p class="text-base font-bold">未読の回覧板が 1件 あります</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-white/60"></i>
          </div>

          <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 flex items-center justify-between border border-white/15 shadow-inner">
            <div class="flex items-center space-x-3.5">
              <div class="bg-amber-500 text-white w-11 h-11 rounded-xl flex items-center justify-center text-lg shadow">
                <i class="fa-solid fa-yen-sign"></i>
              </div>
              <div>
                <p class="text-xs text-white/80 font-medium">スマホ決済・集金</p>
                <p class="text-base font-bold">11月度 集金未完了</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-white/60"></i>
          </div>
        </div>
      </div>
    </section>

    <!-- 3大クイックアクションボタン -->
    <section class="grid grid-cols-1 gap-3.5">
      <button class="w-full bg-white hover:bg-gray-50 border-2 border-forest/10 rounded-2xl p-4 flex items-center justify-between shadow-sm transition group">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-2xl bg-forest/10 text-forest flex items-center justify-center text-xl group-hover:bg-forest group-hover:text-white transition shadow-sm">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <div class="text-left">
            <span class="text-xs text-forest font-bold block mb-0.5">ワンタップで確認</span>
            <span class="text-lg font-bold text-gray-800">回覧板を確認する</span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:bg-coral group-hover:text-white transition shadow-sm">
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </div>
      </button>

      <button class="w-full bg-white hover:bg-gray-50 border-2 border-forest/10 rounded-2xl p-4 flex items-center justify-between shadow-sm transition group">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-2xl bg-coral/10 text-coral flex items-center justify-center text-xl group-hover:bg-coral group-hover:text-white transition shadow-sm">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <div class="text-left">
            <span class="text-xs text-coral font-bold block mb-0.5">キャッシュレス対応</span>
            <span class="text-lg font-bold text-gray-800">スマホ決済で集金・支払</span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:bg-coral group-hover:text-white transition shadow-sm">
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </div>
      </button>

      <button class="w-full bg-white hover:bg-gray-50 border-2 border-forest/10 rounded-2xl p-4 flex items-center justify-between shadow-sm transition group">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition shadow-sm">
            <i class="fa-solid fa-comments"></i>
          </div>
          <div class="text-left">
            <span class="text-xs text-blue-600 font-bold block mb-0.5">チャット形式</span>
            <span class="text-lg font-bold text-gray-800">管理組合へ連絡・相談</span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:bg-coral group-hover:text-white transition shadow-sm">
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </div>
      </button>
    </section>

    <!-- 下部コンテンツエリア：最近の回覧板一覧プレビュー -->
    <section class="space-y-3.5 pt-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="font-bold text-gray-800 text-lg">最近の回覧板</h2>
        <a href="#" class="text-xs font-bold text-forest hover:underline flex items-center space-x-1">
          <span>すべて見る</span>
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </div>

      <div class="space-y-3">
        <!-- 未読アイテム -->
        <div class="bg-white rounded-2xl p-4.5 shadow-sm border-l-4 border-coral flex items-center justify-between transition hover:shadow-md">
          <div class="space-y-1.5 pr-2">
            <div class="flex items-center space-x-2">
              <span class="bg-coral/15 text-coral text-xs font-bold px-2.5 py-0.5 rounded-full">未読</span>
              <span class="text-xs text-gray-400 font-medium">11月12日発信</span>
            </div>
            <h3 class="font-bold text-gray-800 text-base leading-snug">年末の大掃除および共用部点検のお知らせ</h3>
            <p class="text-xs text-gray-500">発信者：管理組合理事会</p>
          </div>
          <button class="bg-coral text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md hover:bg-coral-hover transition whitespace-nowrap">
            確認する
          </button>
        </div>

        <!-- 既読アイテム -->
        <div class="bg-white rounded-2xl p-4.5 shadow-sm border-l-4 border-gray-300 flex items-center justify-between opacity-85 transition hover:opacity-100">
          <div class="space-y-1.5 pr-2">
            <div class="flex items-center space-x-2">
              <span class="bg-gray-100 text-gray-600 text-xs font-bold px-2.5 py-0.5 rounded-full">既読</span>
              <span class="text-xs text-gray-400 font-medium">10月28日発信</span>
            </div>
            <h3 class="font-bold text-gray-800 text-base leading-snug">エレベーター保守点検に伴う一時停止について</h3>
            <p class="text-xs text-gray-500">発信者：管理組合理事会</p>
          </div>
          <span class="text-xs font-bold text-gray-400 px-3 py-2 bg-gray-50 rounded-xl whitespace-nowrap">確認済</span>
        </div>
      </div>
    </section>
  </main>

  <!-- フッターナビゲーション（タブバー） -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200/80 shadow-2xl z-50">
    <div class="max-w-md mx-auto grid grid-cols-5 py-2">
      <button class="flex flex-col items-center justify-center text-forest py-1 group">
        <i class="fa-solid fa-house text-xl mb-1"></i>
        <span class="text-[11px] font-bold">ホーム</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-400 hover:text-forest py-1 transition group">
        <i class="fa-solid fa-book-open text-xl mb-1"></i>
        <span class="text-[11px] font-medium">回覧板</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-400 hover:text-forest py-1 transition group">
        <i class="fa-solid fa-wallet text-xl mb-1"></i>
        <span class="text-[11px] font-medium">集金</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-400 hover:text-forest py-1 transition group">
        <i class="fa-solid fa-comments text-xl mb-1"></i>
        <span class="text-[11px] font-medium">連絡帳</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-400 hover:text-forest py-1 transition group">
        <i class="fa-solid fa-user text-xl mb-1"></i>
        <span class="text-[11px] font-medium">マイページ</span>
      </button>
    </div>
  </nav>

  <script>
    // インタラクション処理
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        // インタラクションログ
      });
    });
  </script>
</body>
</html>

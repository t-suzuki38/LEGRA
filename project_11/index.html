<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ダンジョン・マージ・クロニクル フロントエンド実装 -->
  <title>ダンジョン・マージ・クロニクル</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="[link removed]">
  
  <!-- Google Fonts: レトロファンタジー用ピクセルフォント & モックUI用フォント -->
  <link rel="preconnect" href="[link removed]">
  <link rel="preconnect" href="[link removed]" crossorigin>
  <link href="[link removed]" rel="stylesheet">
  
  <!-- カラーパレット・フォントの設定 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dungeon: {
              bg: '#121020',       /* ディープダンジョンネイビー */
              card: '#1a162b',
              border: '#2e274a',
              panel: '#251f3d'
            },
            emerald: {
              custom: '#2A9D8F',   /* メインハイライト */
              glow: '#3cd0bf',
              dark: '#1e6f65'
            },
            crimson: {
              custom: '#E63946',   /* アクセントカラー */
              dark: '#a8202d',
              glow: '#ff5c6a'
            }
          },
          fontFamily: {
            pixel: ['"DotGothic16"', 'monospace'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* 独自のネオ・レトロファンタジー スタイル定義 */
    body {
      background-color: #121020;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .pixel-font {
      font-family: 'DotGothic16', monospace;
    }

    /* レトロゲーム風ネオンシャドウエフェクト */
    .glow-emerald {
      box-shadow: 0 0 15px rgba(42, 157, 143, 0.4);
    }

    .glow-crimson {
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
    }

    .glow-gold {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    /* パネルのマージアニメーション */
    @keyframes mergePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); filter: brightness(1.3); }
      100% { transform: scale(1); }
    }

    .animate-merge {
      animation: mergePulse 0.25s ease-in-out;
    }

    /* ダメージ・撃破エフェクト */
    @keyframes attackFlash {
      0% { opacity: 0; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .attack-effect {
      animation: attackFlash 0.4s ease-out forwards;
    }

    /* ドット絵風グラデーションボーダー */
    .pixel-border {
      border: 3px solid #2e274a;
      box-shadow: inset -3px -3px 0px rgba(0, 0, 0, 0.4), inset 3px 3px 0px rgba(255, 255, 255, 0.1);
    }

    .pixel-button {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 #0d0b16;
    }

    .pixel-button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #0d0b16;
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121020;
    }
    ::-webkit-scrollbar-thumb {
      background: #2e274a;
      border-radius: 3px;
    }
  </style>
</head>

  <!-- ==================== ゲームロジック (JavaScript) ==================== -->
  <script>
    // 4x4 グリッド用データ構造
    const GRID_SIZE = 4;
    let grid = Array(GRID_SIZE * GRID_SIZE).fill(0);
    let score = 2480;
    let combo = 3;
    let hp = 75;
    let potions = 2;

    // パネル定義(敵・アイテム・攻撃)
    const TILE_TYPES = {
      0: { type: 'empty' },
      1: { type: 'enemy', level: 1, name: 'スライム', icon: 'fa-cube', color: 'text-green-400', bg: 'bg-green-950/40 border-green-800' },
      2: { type: 'enemy', level: 2, name: 'ゴブリン', icon: 'fa-ghost', color: 'text-amber-400', bg: 'bg-amber-950/40 border-amber-800' },
      3: { type: 'enemy', level: 3, name: 'オーク', icon: 'fa-dragon', color: 'text-crimson-glow', bg: 'bg-crimson-dark/40 border-crimson-custom' },
      4: { type: 'enemy', level: 4, name: '魔王の影', icon: 'fa-skull', color: 'text-purple-400', bg: 'bg-purple-950/60 border-purple-600' },
      10: { type: 'sword', name: '聖剣', icon: 'fa-wand-magic-sparkles', color: 'text-cyan-300', bg: 'bg-cyan-950/40 border-cyan-700' }
    };

    // 初期化
    function initGame() {
      // 模擬の初期盤面データ配置
      grid = [
        1, 1, 2, 0,
        0, 2, 3, 10,
        1, 0, 3, 1,
        2, 1, 0, 4
      ];
      renderBoard();
    }

    // 盤面の描画更新
    function renderBoard() {
      const board = document.getElementById('grid-board');
      board.innerHTML = '';

      grid.forEach((tileValue, index) => {
        const tile = document.createElement('div');
        const tileInfo = TILE_TYPES[tileValue] || TILE_TYPES[1];

        tile.className = `relative rounded-xl border flex flex-col items-center justify-center transition-all duration-200 select-none ${
          tileValue === 0 
            ? 'bg-dungeon-bg/40 border-dungeon-border/40' 
            : `${tileInfo.bg} shadow-md`
        }`;

        if (tileValue !== 0) {
          tile.innerHTML = `
            <div class="${tileInfo.color} text-xl mb-1">
              <i class="fa-solid ${tileInfo.icon}"></i>
            </div>
            <span class="pixel-font text-[10px] text-slate-200 font-bold">${tileInfo.name}</span>
            ${tileInfo.level ? `<span class="absolute top-1 right-1 text-[8px] bg-black/60 px-1 rounded text-amber-400 font-bold">L${tileInfo.level}</span>` : ''}
          `;
        }

        board.appendChild(tile);
      });

      // ステータス更新
      document.getElementById('score').innerText = score.toLocaleString().padStart(6, '0');
      document.getElementById('combo-count').innerText = combo;
      document.getElementById('potion-count').innerText = `x${potions}`;
    }

    // パネルスライド・マージの擬似処理
    function moveGrid(direction) {
      // マージ動作アニメーション演出
      score += 120;
      combo = Math.min(combo + 1, 8);
      
      // ランダムパネル追加
      const emptyIndices = grid.map((v, i) => v === 0 ? i : -1).filter(v => v !== -1);
      if (emptyIndices.length > 0) {
        const randIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        grid[randIdx] = Math.random() > 0.3 ? 1 : 2;
      }

      renderBoard();
      showEffectText('MERGE!', 'text-emerald-custom');
    }

    // 「あえて大きく育った敵パネルをまとめて撃破する」ジレンマ&快感アクション
    function executeAttack() {
      let enemyCount = 0;
      grid = grid.map(val => {
        if (val > 0 && val !== 10) {
          enemyCount++;
          return 0; // 敵を一括クリア
        }
        return val;
      });

      if (enemyCount > 0) {
        const gainedScore = enemyCount * 500 * combo;
        score += gainedScore;
        showEffectText(`ENEMIES WIPED! +${gainedScore}`, 'text-amber-400');
        renderBoard();
      } else {
        showEffectText('敵がいません!', 'text-slate-400');
      }
    }

    // ポーション使用
    function usePotion() {
      if (potions > 0) {
        potions--;
        hp = Math.min(hp + 30, 100);
        document.getElementById('hp-bar').style.width = `${hp}%`;
        renderBoard();
        showEffectText('HP RECOVERED!', 'text-emerald-glow');
      }
    }

    // バトル演出テキスト表示
    function showEffectText(text, colorClass) {
      const effectLayer = document.getElementById('effect-layer');
      const effect = document.createElement('div');
      effect.className = `attack-effect pixel-font text-lg font-bold ${colorClass} drop-shadow-lg`;
      effect.innerText = text;
      effectLayer.appendChild(effect);

      setTimeout(() => {
        effect.remove();
      }, 400);
    }

    // モーダル開閉
    function toggleModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.toggle('hidden');
    }

    function openShareModal() {
      // 挑戦URLの発行
      const randomCode = Math.random().toString(36).substring(2, 8);
      document.getElementById('share-url-input').value = `https://dungeon-merge.example/challenge?id=${randomCode}`;
      toggleModal('share-modal');
    }

    function openShopModal() { toggleModal('shop-modal'); }
    function openChallengeModal() { alert('【挑戦課題】\n・魔王(Lv4)をマージで生成せよ!\n・1度の撃破で5,000pt獲得せよ!'); }
    function openRankingModal() { alert('【全国ランキング】\n1位: HERO_TAKASHI (98,400pt)\n2位: DUNGEON_MASTER (84,100pt)\n3位: YOU (2,480pt)'); }

    function copyShareUrl() {
      const copyText = document.getElementById('share-url-input');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('挑戦URLをコピーしました!SNSでシェアしよう!');
    }

    function shareToX() {
      const url = encodeURIComponent(document.getElementById('share-url-input').value);
      const text = encodeURIComponent('【ダンジョン・マージ・クロニクル】私が構築した超高難易度の盤面をクリアできるか!?挑戦求む! #ダンジョンマージ');
      window.open(`[link removed]{text}&url=${url}`, '_blank');
    }

    function resetGame() {
      score = 0;
      combo = 1;
      hp = 100;
      document.getElementById('hp-bar').style.width = '100%';
      initGame();
    }

    // キーボード操作対応
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') moveGrid('up');
      if (e.key === 'ArrowDown') moveGrid('down');
      if (e.key === 'ArrowLeft') moveGrid('left');
      if (e.key === 'ArrowRight') moveGrid('right');
      if (e.key === ' ') executeAttack();
    });

    // 起動
    initGame();
  </script>
</body>
</html>

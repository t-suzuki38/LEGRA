<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遠隔・家族の形見分け共有アプリ「テミモ」</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <style>
    @import url('[link removed]');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #F9F6F0;
      color: #333333;
    }
    .rounded-title {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F9F6F0] min-h-screen flex flex-col pb-20">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-[#1B4D3E] text-2xl font-bold rounded-title">テミモ</span>
      <span class="text-xs bg-[#1B4D3E]/10 text-[#1B4D3E] px-2 py-0.5 rounded-full font-medium">家族共有</span>
    </div>
    <div class="flex items-center space-x-4">
      <button class="relative text-gray-600 hover:text-[#1B4D3E]">
        <i class="fa-regular fa-bell text-xl"></i>
        <span class="absolute -top-1 -right-1 bg-[#FF7F50] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">2</span>
      </button>
      <div class="w-8 h-8 rounded-full bg-[#1B4D3E] text-white flex items-center justify-center font-bold text-sm">
        鈴木
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

    <!-- メインビジュアル / ステータスカード -->
    <section class="bg-gradient-to-r from-[#1B4D3E] to-[#2B6E5B] text-white rounded-2xl p-6 shadow-lg relative overflow-hidden">
      <div class="absolute right-0 bottom-0 opacity-10 translate-x-4 translate-y-4">
        <i class="fa-solid fa-box-archive text-9xl"></i>
      </div>
      <div class="relative z-10">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p class="text-xs text-[#F9F6F0]/80 font-medium">進行中のプロジェクト</p>
            <h2 class="text-xl font-bold rounded-title mt-1">実家(東京都世田谷区)の形見分け</h2>
          </div>
          <span class="bg-[#FF7F50] text-white text-xs px-3 py-1 rounded-full font-bold">合意率 65%</span>
        </div>
        <p class="text-sm text-[#F9F6F0]/90 mb-4">離れて暮らす家族(3名)でリアルタイムに遺品を仕分け中です。未解決の合意事項が2件あります。</p>
        <div class="flex items-center space-x-2 text-xs bg-white/10 backdrop-blur-sm px-3 py-2 rounded-xl">
          <i class="fa-solid fa-triangle-exclamation text-[#FF7F50]"></i>
          <span>母の和ダンスの着物について要相談</span>
        </div>
      </div>
    </section>

    <!-- コントロールバー / フィルター -->
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-bold rounded-title text-[#1B4D3E]">アイテム一覧</h3>
      <div class="flex space-x-2">
        <button class="px-3 py-1.5 bg-[#1B4D3E] text-white text-xs rounded-full font-medium shadow-sm">すべて</button>
        <button class="px-3 py-1.5 bg-white text-gray-600 text-xs rounded-full font-medium shadow-sm hover:bg-gray-50">未投票</button>
        <button class="px-3 py-1.5 bg-white text-gray-600 text-xs rounded-full font-medium shadow-sm hover:bg-gray-50">キープ</button>
      </div>
    </div>

    <!-- コンテンツエリア: カードグリッド -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- カード 1 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
        <div>
          <div class="relative h-48 bg-gray-200">
            <img src="[link removed]" alt="祖父の腕時計" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-[#1B4D3E] text-xs px-2.5 py-1 rounded-full font-bold shadow-sm">
              <i class="fa-solid fa-clock mr-1"></i> 時計・貴金属
            </span>
          </div>
          <div class="p-4">
            <h4 class="font-bold text-base rounded-title mb-1">祖父の機械式腕時計(SEIKO)</h4>
            <p class="text-xs text-gray-500 mb-3">状態良好、裏蓋に刻印あり。父が大切に使っていたもの。</p>
            <div class="flex items-center justify-between text-xs text-gray-600 bg-gray-50 p-2 rounded-xl mb-3">
              <span>投票状況: 2/3 票合意</span>
              <span class="text-[#1B4D3E] font-medium"><i class="fa-regular fa-comment mr-1"></i>コメント 3件</span>
            </div>
          </div>
        </div>
        <!-- 3択ボタン -->
        <div class="px-4 pb-4 grid grid-cols-3 gap-2">
          <button onclick="vote(this, 'keep')" class="py-2 px-3 border border-[#1B4D3E] text-[#1B4D3E] hover:bg-[#1B4D3E] hover:text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-heart"></i>
            <span>キープ</span>
          </button>
          <button onclick="vote(this, 'give')" class="py-2 px-3 border border-[#FF7F50] text-[#FF7F50] hover:bg-[#FF7F50] hover:text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-gift"></i>
            <span>ゆずる</span>
          </button>
          <button onclick="vote(this, 'hold')" class="py-2 px-3 border border-gray-300 text-gray-600 hover:bg-gray-100 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-pause"></i>
            <span>保留</span>
          </button>
        </div>
      </div>

      <!-- カード 2 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
        <div>
          <div class="relative h-48 bg-gray-200">
            <img src="[link removed]" alt="古いアルバム" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-[#1B4D3E] text-xs px-2.5 py-1 rounded-full font-bold shadow-sm">
              <i class="fa-solid fa-book-open mr-1"></i> 写真・アルバム
            </span>
          </div>
          <div class="p-4">
            <h4 class="font-bold text-base rounded-title mb-1">昭和50年代 家族旅行アルバム(全3冊)</h4>
            <p class="text-xs text-gray-500 mb-3">熱海旅行の写真や子供の頃のスナップ多数。</p>
            <div class="flex items-center justify-between text-xs text-gray-600 bg-gray-50 p-2 rounded-xl mb-3">
              <span>投票状況: 3/3 票合意</span>
              <span class="text-[#1B4D3E] font-medium"><i class="fa-regular fa-comment mr-1"></i>コメント 5件</span>
            </div>
          </div>
        </div>
        <!-- 3択ボタン -->
        <div class="px-4 pb-4 grid grid-cols-3 gap-2">
          <button onclick="vote(this, 'keep')" class="py-2 px-3 bg-[#1B4D3E] text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-heart"></i>
            <span>キープ</span>
          </button>
          <button onclick="vote(this, 'give')" class="py-2 px-3 border border-[#FF7F50] text-[#FF7F50] hover:bg-[#FF7F50] hover:text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-gift"></i>
            <span>ゆずる</span>
          </button>
          <button onclick="vote(this, 'hold')" class="py-2 px-3 border border-gray-300 text-gray-600 hover:bg-gray-100 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
            <i class="fa-solid fa-pause"></i>
            <span>保留</span>
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- フローティングボタン: 新規アイテム追加 -->
  <button onclick="openModal()" class="fixed bottom-20 right-6 bg-[#FF7F50] hover:bg-[#e06d43] text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl transition-transform hover:scale-105 z-40">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- フッター: 固定タブバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-around items-center z-50">
    <a href="#" class="flex flex-col items-center text-[#1B4D3E]">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] mt-1 font-medium">ホーム</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-[#1B4D3E]">
      <i class="fa-solid fa-box-archive text-lg"></i>
      <span class="text-[10px] mt-1 font-medium">アイテム</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-[#1B4D3E] relative">
      <i class="fa-regular fa-comments text-lg"></i>
      <span class="absolute -top-1 -right-2 bg-[#FF7F50] text-white text-[9px] px-1 rounded-full">1</span>
      <span class="text-[10px] mt-1 font-medium">チャット</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-[#1B4D3E]">
      <i class="fa-regular fa-user text-lg"></i>
      <span class="text-[10px] mt-1 font-medium">マイページ</span>
    </a>
  </nav>

  <!-- JavaScriptの記述 -->
  <script>
    function vote(button, type) {
      const parent = button.parentElement;
      const buttons = parent.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.className = "py-2 px-3 border border-gray-300 text-gray-600 hover:bg-gray-100 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1";
      });
      
      if (type === 'keep') {
        button.className = "py-2 px-3 bg-[#1B4D3E] text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1 shadow-sm";
      } else if (type === 'give') {
        button.className = "py-2 px-3 bg-[#FF7F50] text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1 shadow-sm";
      } else {
        button.className = "py-2 px-3 bg-gray-600 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1 shadow-sm";
      }
    }

    function openModal() {
      alert('新規アイテム追加モーダルを開きます');
    }
  </script>

</body>
</html>

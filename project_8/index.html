<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1分スキマリスキリング『ピタッと学習』</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="[link removed]">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deepBlue: '#0F172A',
            accentOrange: '#F97316',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-orange-500 selection:text-white">
  <!-- ヘッダーエリア -->
  <header class="flex justify-between items-center px-6 py-4 bg-[#0F172A]/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800/80">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-accentOrange rounded-2xl flex items-center justify-center text-white font-bold shadow-lg shadow-orange-500/30">
        <i class="fa-solid fa-puzzle-piece"></i>
      </div>
      <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ピタッと学習</span>
    </div>
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 bg-slate-800/80 px-3.5 py-1.5 rounded-full border border-slate-700/60 shadow-inner">
        <i class="fa-solid fa-fire text-accentOrange animate-pulse"></i>
        <span class="text-xs font-bold tracking-wide">5日連続</span>
      </div>
      <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 overflow-hidden flex items-center justify-center shadow-md">
        <i class="fa-solid fa-user text-slate-300 text-sm"></i>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">
    <!-- メインビジュアルエリア -->
    <section class="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-5 shadow-2xl space-y-5 relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-accentOrange/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex justify-between items-center text-sm">
        <span class="text-slate-400 font-medium">本日の学習進捗</span>
        <span class="text-accentOrange font-bold bg-orange-500/10 px-2.5 py-1 rounded-full border border-orange-500/20 text-xs">1 / 1 レッスン</span>
      </div>
      
      <!-- プログレスバー -->
      <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
        <div class="bg-gradient-to-r from-orange-500 to-amber-400 h-full w-full rounded-full shadow-lg shadow-orange-500/50 transition-all duration-500"></div>
      </div>
      
      <!-- アニメーション解説プレビュー枠 -->
      <div class="relative bg-gradient-to-br from-slate-900 to-slate-900/90 rounded-2xl h-52 border border-slate-700/80 overflow-hidden flex flex-col items-center justify-center p-6 group cursor-pointer shadow-inner">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(249,115,22,0.12)_0,transparent_70%)]"></div>
        <div class="w-16 h-16 rounded-2xl bg-accentOrange/20 border border-accentOrange/40 flex items-center justify-center text-accentOrange text-xl mb-3 shadow-lg shadow-orange-500/20 group-hover:scale-110 transition-transform duration-300">
          <i class="fa-solid fa-play ml-0.5"></i>
        </div>
        <h3 class="font-bold text-base text-slate-100 tracking-tight text-center">1分でわかる!今日のリスキリング</h3>
        <p class="text-xs text-slate-400 mt-1">音声なしで直感的に学べるアニメーション</p>
      </div>
    </section>

    <!-- ボタン・操作エリア -->
    <section class="text-center space-y-3">
      <button onclick="startLesson()" class="w-full py-4.5 bg-gradient-to-r from-accentOrange to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold text-lg rounded-2xl shadow-xl shadow-orange-500/25 transition-all transform active:scale-95 flex items-center justify-center space-x-2.5 border border-orange-400/30">
        <i class="fa-solid fa-bolt"></i>
        <span>1分レッスンを始める</span>
      </button>
      <p class="text-xs text-slate-400">電車の待ち時間やスキマ時間で自己成長を実感</p>
    </section>

    <!-- コアバリューカードグリッド -->
    <section class="grid grid-cols-2 gap-3.5 pt-2">
      <div class="bg-slate-800/30 hover:bg-slate-800/50 border border-slate-700/40 p-4 rounded-2xl space-y-2 transition-colors">
        <div class="w-8 h-8 rounded-xl bg-orange-500/10 text-accentOrange flex items-center justify-center font-bold text-sm">
          <i class="fa-solid fa-gauge-high"></i>
        </div>
        <h4 class="font-bold text-xs text-slate-200">高速レスポンス</h4>
        <p class="text-xs text-slate-400 leading-relaxed">タップ一つで瞬時に起動し待ち時間ゼロ。</p>
      </div>
      <div class="bg-slate-800/30 hover:bg-slate-800/50 border border-slate-700/40 p-4 rounded-2xl space-y-2 transition-colors">
        <div class="w-8 h-8 rounded-xl bg-orange-500/10 text-accentOrange flex items-center justify-center font-bold text-sm">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <h4 class="font-bold text-xs text-slate-200">無理なく継続</h4>
        <p class="text-xs text-slate-400 leading-relaxed">1日1分で知識が確実定着する設計。</p>
      </div>
    </section>
  </main>

  <!-- 固定ボトムナビゲーション -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#0F172A]/90 backdrop-blur-lg border-t border-slate-800/80 py-2.5 px-6 flex justify-around items-center z-50">
    <button onclick="switchTab(this)" class="nav-btn flex flex-col items-center space-y-1 text-accentOrange transition-colors">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-semibold">ホーム</span>
    </button>
    <button onclick="switchTab(this)" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i class="fa-solid fa-book-open text-lg"></i>
      <span class="text-[10px] font-semibold">カリキュラム</span>
    </button>
    <button onclick="switchTab(this)" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i class="fa-solid fa-chart-line text-lg"></i>
      <span class="text-[10px] font-semibold">実績</span>
    </button>
    <button onclick="switchTab(this)" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i class="fa-solid fa-crown text-lg"></i>
      <span class="text-[10px] font-semibold">プレミアム</span>
    </button>
  </nav>

  <script>
    function startLesson() {
      // レッスン開始時のインタラクション
      const btn = document.querySelector('button[onclick="startLesson()"]');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>読み込み中...</span>';
      setTimeout(() => {
        alert('1分レッスン(マイクロラーニング)を起動しました!');
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i><span>1分レッスンを始める</span>';
      }, 500);
    }

    function switchTab(selectedButton) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-accentOrange');
        btn.classList.add('text-slate-400');
      });
      selectedButton.classList.remove('text-slate-400');
      selectedButton.classList.add('text-accentOrange');
    }
  </script>
</body>
</html>
